name: Flutter validation

on:
  push:
    branches: [main, prep/tudo-aki-2-fase-1, refactor/fase-2a-modulos-antigos, refactor/fase-2b-tarefas]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SQLite nativo
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Obter Flutter 3.35.7 na revisão do projecto
        shell: bash
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Conferir Flutter e Dart
        run: |
          flutter --version
          dart --version 2>&1 | tee dart-version.txt
          grep -F 'Dart SDK version: 3.9.2 ' dart-version.txt
      - name: Resolver dependências sem actualizar o lockfile
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Testar processamento dos resultados
        run: python3 -m unittest discover -s tool -p 'test_summarize_flutter_tests.py' -v
      - name: Formatação, análise e testes
        shell: bash
        run: |
          mkdir -p validation
          # Run all three checks even when an earlier check fails; aggregate
          # their exit codes below so that failures cannot become a green job.
          set +e
          dart format --output=none --set-exit-if-changed lib test > validation/format.txt 2>&1
          format_status=$?
          flutter analyze > validation/analyze.txt 2>&1
          analyze_status=$?
          flutter test --machine > validation/tests.jsonl 2> validation/test-stderr.txt
          test_status=$?
          git diff --exit-code -- pubspec.yaml pubspec.lock > validation/lockfile.txt
          lock_status=$?
          cat validation/format.txt validation/analyze.txt validation/test-stderr.txt
          printf 'format=%s analyze=%s test=%s lock=%s\n' "$format_status" "$analyze_status" "$test_status" "$lock_status" | tee validation/exit-codes.txt
          python3 tool/summarize_flutter_tests.py validation/tests.jsonl validation/summary.json --step-summary "$GITHUB_STEP_SUMMARY"
          summary_status=$?
          printf 'summary=%s\n' "$summary_status" >> validation/exit-codes.txt
          if (( format_status || analyze_status || test_status || lock_status || summary_status )); then
            exit 1
          fi
      - name: Guardar apenas logs de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-logs
          path: validation/
          if-no-files-found: ignore
          retention-days: 14
