<svg xmlns="http://www.w3.org/2000/svg" width="360" height="614" viewBox="0 0 360 614" role="img" aria-labelledby="title desc"><title id="title">Nova tarefa — wireframe conceptual light</title><desc id="desc">Proposta de estrutura, não captura Flutter nem implementação.</desc><defs><filter id="clayShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#202B29" flood-opacity="0.08"/></filter></defs><rect width="360" height="614" fill="#F7F8F5"/><text x="20" y="30" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#5D6965">CONCEPTUAL · NÃO É FLUTTER</text><text x="20" y="75" font-family="Newsreader, Georgia, serif" font-size="32" font-weight="700" fill="#202B29">Nova tarefa</text><text x="20" y="105" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5D6965">Só o nome é obrigatório.</text><rect x="16" y="137" width="328" height="70" rx="12" fill="#FFFFFF" stroke="#66736D"/><text x="28" y="163" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#202B29">Nome</text><text x="28" y="186" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">O que quer fazer?</text><text x="20" y="247" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#456C50">Dia: sem data · Escolher dia</text><rect x="16" y="283" width="328" height="48" rx="12" fill="#FFFFFF" stroke="#66736D"/><text x="28" y="309" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#202B29">＋ Mais opções</text><rect x="16" y="345" width="328" height="48" rx="14" fill="#9ECB8F" stroke="none"/><text x="28" y="371" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#202B29">Guardar</text><text x="20" y="433" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5D6965">Guardar e adicionar outra surge ao</text><text x="20" y="452" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5D6965">escrever ou abrir opções. Contrato</text><text x="20" y="471" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#5D6965">4B preservado.</text><rect x="0" y="516" width="360" height="64" fill="#FFFFFF"/><text x="24" y="552" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5D6965">Hoje     Planear     Metas     Mais</text><text x="20" y="590" font-family="Arial" font-size="11" fill="#5D6965">Exemplos fictícios · 360 unidades de desenho</text></svg>