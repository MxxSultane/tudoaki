<svg xmlns="http://www.w3.org/2000/svg" width="360" height="886" viewBox="0 0 360 886" role="img" aria-labelledby="title desc"><title id="title">Progresso — wireframe conceptual light</title><desc id="desc">Proposta de estrutura, não captura Flutter nem implementação.</desc><defs><filter id="clayShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#202B29" flood-opacity="0.08"/></filter></defs><rect width="360" height="886" fill="#F7F8F5"/><text x="20" y="30" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#5D6965">CONCEPTUAL · NÃO É FLUTTER</text><text x="20" y="75" font-family="Newsreader, Georgia, serif" font-size="32" font-weight="700" fill="#202B29">Progresso</text><text x="20" y="105" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5D6965">Actividade real, ao seu ritmo.</text><rect x="16" y="137" width="328" height="116" rx="12" fill="#FFFFFF" stroke="none"/><text x="28" y="163" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#202B29">Últimos sete dias</text><text x="28" y="186" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">1 tarefa · 2 registos de</text><text x="28" y="209" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">hábitos</text><text x="28" y="232" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">1 sessão de estudo</text><rect x="16" y="267" width="328" height="116" rx="20" fill="#FDFDFD" stroke="#66736D"/><text x="28" y="293" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#202B29">Exploração do Percurso</text><text x="28" y="316" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">○ ─ ○   ○</text><text x="28" y="339" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">Esboço decorativo. Lista</text><text x="28" y="362" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">equivalente abaixo.</text><text x="20" y="423" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#202B29">Actividade registada</text><text x="20" y="446" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">12 Nov. · 1 tarefa concluída</text><text x="20" y="469" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">11 Nov. · 2 registos de hábitos</text><text x="20" y="492" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">10 Nov. · 1 sessão de estudo</text><rect x="16" y="527" width="328" height="93" rx="20" fill="#E8EDE6" stroke="none" filter="url(#clayShadow)"/><text x="28" y="553" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#202B29">Metas em evolução</text><text x="28" y="576" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">Preparar lançamento · 2 de 4</text><text x="28" y="599" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#5D6965">etapas</text><rect x="16" y="634" width="328" height="48" rx="12" fill="#FFFFFF" stroke="#66736D"/><text x="28" y="660" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#202B29">＋ Hábitos e histórico</text><rect x="16" y="696" width="328" height="48" rx="12" fill="#FFFFFF" stroke="#66736D"/><text x="28" y="722" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#202B29">＋ Conquistas e XP, se activados</text><text x="20" y="784" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#456C50">Fazer uma revisão</text><text x="20" y="834" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#5D6965">Voltar mantém a navegação actual.</text><text x="20" y="862" font-family="Arial" font-size=