<svg xmlns="http://www.w3.org/2000/svg" width="360" height="712" viewBox="0 0 360 712" role="img" aria-labelledby="title desc"><title id="title">Criar meta — wireframe conceptual dark</title><desc id="desc">Proposta de estrutura, não captura Flutter nem implementação.</desc><defs><filter id="clayShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#202B29" flood-opacity="0.08"/></filter></defs><rect width="360" height="712" fill="#18201D"/><text x="20" y="30" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#BCC6BE">CONCEPTUAL · NÃO É FLUTTER</text><text x="20" y="75" font-family="Newsreader, Georgia, serif" font-size="32" font-weight="700" fill="#F2F5EF">Criar meta</text><text x="20" y="105" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#BCC6BE">O que quer alcançar?</text><rect x="16" y="137" width="328" height="70" rx="12" fill="#202B29" stroke="#8E9D92"/><text x="28" y="163" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2F5EF">Nome</text><text x="28" y="186" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">Ex.: Enviar candidatura</text><rect x="16" y="221" width="328" height="70" rx="12" fill="#202B29" stroke="#8E9D92"/><text x="28" y="247" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2F5EF">Prazo em dias (opcional)</text><text x="28" y="270" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">30</text><text x="20" y="331" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#BCC6BE">Exemplo: criação 12 Nov. → até 12</text><text x="20" y="350" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#BCC6BE">Dez. 2026.</text><rect x="16" y="381" width="328" height="48" rx="12" fill="#202B29" stroke="#8E9D92"/><text x="28" y="407" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2F5EF">＋ Acompanhamento adicional</text><rect x="16" y="443" width="328" height="48" rx="14" fill="#9ECB8F" stroke="none"/><text x="28" y="469" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#202B29">Criar</text><text x="20" y="531" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#BCC6BE">Sem medida escolhida: concluir</text><text x="20" y="550" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#BCC6BE">quando alcançar. Sem percentagem</text><text x="20" y="569" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#BCC6BE">artificial.</text><rect x="0" y="614" width="360" height="64" fill="#202B29"/><text x="24" y="650" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#BCC6BE">Hoje     Planear     Metas     Mais</text><text x="20" y="688" font-family="Arial" font-size="11" fill="#BCC6BE">Exemplos fictícios · 360 unidades de desenho</text></svg>