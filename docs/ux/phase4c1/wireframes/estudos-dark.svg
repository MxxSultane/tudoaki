xt x="28" y="416" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2F5EF">Matemática</text><text x="28" y="439" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">1 trabalho e 1 avaliação</text><text x="28" y="462" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">próximos</text><rect x="16" y="497" width="328" height="93" rx="20" fill="#28352E" stroke="none" filter="url(#clayShadow)"/><text x="28" y="523" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2F5EF">Comunicação</text><text x="28" y="546" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">Sem entregas com prazo</text><text x="28" y="569" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">registado</text><rect x="16" y="604" width="328" height="48" rx="12" fill="#202B29" stroke="#8E9D92"/><text x="28" y="630" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2F5EF">＋ Sessões e histórico</text><rect x="16" y="666" width="328" height="48" rx="12" fill="#202B29" stroke="#8E9D92"/><text x="28" y="692" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2F5EF">＋ Horários e aulas</text><text x="20" y="742" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#BCC6BE">Voltar mantém a navegação actual.</text><text x="20" y="770" font-family="Arial" font-size="11" fill="#BCC6BE">Exemplos fictícios · 360 unidades de desenho</text></svg>