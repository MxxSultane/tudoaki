a</text><text x="28" y="362" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">equivalente abaixo.</text><text x="20" y="423" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2F5EF">Actividade registada</text><text x="20" y="446" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">12 Nov. · 1 tarefa concluída</text><text x="20" y="469" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">11 Nov. · 2 registos de hábitos</text><text x="20" y="492" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">10 Nov. · 1 sessão de estudo</text><rect x="16" y="527" width="328" height="93" rx="20" fill="#28352E" stroke="none" filter="url(#clayShadow)"/><text x="28" y="553" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2F5EF">Metas em evolução</text><text x="28" y="576" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">Preparar lançamento · 2 de 4</text><text x="28" y="599" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#BCC6BE">etapas</text><rect x="16" y="634" width="328" height="48" rx="12" fill="#202B29" stroke="#8E9D92"/><text x="28" y="660" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2F5EF">＋ Hábitos e histórico</text><rect x="16" y="696" width="328" height="48" rx="12" fill="#202B29" stroke="#8E9D92"/><text x="28" y="722" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2F5EF">＋ Conquistas e XP, se activados</text><text x="20" y="784" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#9ECB8F">Fazer uma revisão</text><text x="20" y="834" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#BCC6BE">Voltar mantém a navegação actual.</text><text x="20" y="862" font-family="Arial" font-size="